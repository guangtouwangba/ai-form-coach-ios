name: Bug report
description: Report a reproducible product or engineering problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload identifiable workout videos without explicit consent.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exercise phase and the expected behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and OS
      placeholder: iPhone 15, iOS 18.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-identifying evidence
      description: Rule/model version, confidence, timing, logs or synthetic landmark fixtures.
