  <style>
    :root { color-scheme: light; --bg:#eef1ed; --ink:#15201e; --muted:#66716e; --mint:#0bb8a5; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"SF Pro Text","PingFang SC",sans-serif; }
    header { padding:48px clamp(24px,5vw,80px) 28px; background:#07100f; color:#f6f7f4; }
    header p { max-width:760px; color:#aeb9b5; line-height:1.7; }
    header a { color:#64e6d2; font-weight:700; }
    main { padding:32px clamp(20px,4vw,64px) 64px; }
    section { margin:0 0 48px; }
    h2 { margin:0 0 18px; font-size:22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; align-items:start; }
    figure { margin:0; padding:14px; border-radius:18px; background:var(--surface); box-shadow:0 10px 30px rgba(7,16,15,.08); }
    img { display:block; width:100%; height:auto; border-radius:12px; background:#07100f; }
    figcaption { display:flex; gap:8px; align-items:baseline; padding:12px 2px 2px; line-height:1.45; }
    .num { color:var(--mint); font-weight:700; font-variant-numeric:tabular-nums; }
    .name { font-size:14px; }
  </style>
</head>
