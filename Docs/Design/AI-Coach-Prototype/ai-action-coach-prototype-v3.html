      if(s.group==='05 无障碍')return accessibilityContent(s);

      if(s.kind==='launch')return '<div style="margin:auto;text-align:center;display:grid;gap:16px;place-items:center">'+icon('shield')+'<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="spinner"></div></div>';
      if(s.kind==='home')return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="hero-art"><span class="status">动作由你选择</span></div><div class="list"><div class="list-row"><span><strong>未完成会话</strong><small>存在时显示动作、训练腿与已完成组</small></span><span>›</span></div><div class="list-row"><span><strong>最近训练会话</strong><small>按会话而不是单组组织</small></span><span>›</span></div></div>';
      if(s.kind==='select')return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="app-card"><div class="hero-art" style="min-height:132px"></div><h3 style="margin-top:12px">保加利亚分腿蹲</h3><p class="screen-copy">纯侧面 · 单人 · 端侧识别</p></div>';
      if(s.kind==='setup')return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="list"><div class="list-row"><span><strong>动作</strong><small>保加利亚分腿蹲</small></span><span>沿用</span></div><div class="list-row"><span><strong>训练腿</strong><small>本次会话级设置</small></span><span>右腿</span></div><div class="list-row"><span><strong>训练目标</strong><small>本次会话级设置</small></span><span>一般检查</span></div><div class="list-row"><span><strong>校准基线</strong><small>后续各组复用</small></span><span>已建立</span></div></div>';
      if(s.kind==='camera-guide')return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="hero-art"><div class="camera-frame" style="inset:18px 54px 18px"></div></div><div class="app-card"><h3>侧面机位检查</h3><p class="screen-copy">完整入镜 · 固定支撑 · 远离器械路径</p></div>';
      if(['camera','quality'].includes(s.kind))return '<div class="camera"><div class="camera-frame"></div><div class="guide"><span class="status '+statusClass(s)+'">'+s.title+'</span><strong style="margin-top:12px">'+s.detail+'</strong><p>已完成重复和会话设置不会丢失。</p></div></div><div class="rep-counter">0 <small>次</small></div>'+counts();
      if(s.kind==='summary')return '<span class="status '+statusClass(s)+'">本组训练结果</span><h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p>'+counts()+(s.id==='P0-SUMMARY-CLEAN'?'<div class="empty-actions">本组没有发现需要调整的问题，所以这次不提供下一组建议。</div>':'<div class="action-list"><div class="action-item"><span>下一组先专注本组最主要的问题。</span></div><div class="action-item"><span>只有判断足够可靠时才显示建议，最多三条。</span></div></div>');
      if(s.kind==='detail')return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="evidence"><div class="evidence-row"><strong>训练记录</strong><span>计数和已经发现的问题会保持原样</span></div><div class="evidence-row"><strong>为什么这样判断</strong><span>根据动作关键点、画面完整度、拍摄角度和本次会话基线</span></div><div class="evidence-row"><strong>暂时看不准</strong><span>缺少必要画面时会直接说明，不会猜</span></div></div>';
      if(['history','settings'].includes(s.kind))return '<h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="list"><div class="list-row"><span><strong>主要信息</strong><small>'+s.condition+'</small></span><span>›</span></div><div class="list-row"><span><strong>状态与恢复</strong><small>'+s.recovery+'</small></span><span>›</span></div><div class="list-row"><span><strong>数据边界</strong><small>'+s.upload+'</small></span><span>›</span></div></div>';
      if(s.kind==='loading')return '<div style="margin:auto;display:grid;place-items:center;text-align:center;gap:16px"><div class="spinner"></div><h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p></div>';
      if(['upload','gemini','store'].includes(s.kind))return '<span class="status">P1 · 需要网络</span><h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="app-card"><h3>数据范围</h3><p class="screen-copy">'+s.upload+'</p></div>'+(s.kind==='upload'?'<div class="progress" style="--progress:58%"><span></span></div><p class="condition">示例上传状态 · 实际进度由任务返回</p>':'');
      if(s.kind==='ai-result')return '<span class="status warn">Gemini 的解读</span><h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="fact-block"><h3>你的训练记录</h3><p>计数和已经发现的问题会保持原样。</p></div><div class="ai-block"><h3>Gemini 的解读</h3><p>只帮助理解训练结束后的内容，不参与实时判断。</p></div><div class="uncertain-block"><h3>还不能确定的地方</h3><p>缺少必要画面时会直接说明，不会猜。</p></div>'+(s.id==='P1-RESULT-CONFLICT'?'<div class="conflict"><strong>有一处需要确认</strong><p>对不上的内容不会修改训练记录。</p></div>':'');
      if(s.kind==='a11y')return '<h1 class="screen-title a11y-title">'+s.title+'</h1><p class="screen-copy" style="font-size:19px;line-height:1.7">'+s.detail+'</p><div class="app-card"><h3 style="font-size:22px">无障碍说明</h3><p class="screen-copy" style="font-size:18px">'+s.a11y+'</p></div>';
      return '<span class="status '+statusClass(s)+'">'+(s.tier==='P1'?'P1 · 云端组后':'端侧状态')+'</span><h1 class="screen-title">'+s.title+'</h1><p class="screen-copy">'+s.detail+'</p><div class="app-card"><h3>进入条件</h3><p class="screen-copy">'+s.condition+'</p></div><div class="app-card"><h3>恢复路径</h3><p class="screen-copy">'+s.recovery+'</p></div>';
    }
    function tabbar(s){if(!['P0-HOME','A11Y-HOME-XXXL','P0-HISTORY-SESSIONS','P0-MY-LOCAL'].includes(s.id))return '';const active=s.id==='P0-HOME'||s.id==='A11Y-HOME-XXXL'?0:s.id==='P0-HISTORY-SESSIONS'?1:2,tabs=[['训练','training','P0-HOME'],['历史','history','P0-HISTORY-SESSIONS'],['我的','profile','P0-MY-LOCAL']];return '<nav class="tabbar" aria-label="主要导航">'+tabs.map((x,i)=>'<button class="tab '+(i===active?'active':'')+'" data-go="'+x[2]+'" aria-label="'+x[0]+(i===active?'，当前页面':'')+'">'+icon(x[1])+'<span>'+x[0]+'</span></button>').join('')+'</nav>'}
    const secondaryTargets={
      'P0-HOME':'P0-DRAFT-RESUME','P0-PERMISSION-REQUEST':'P0-PERMISSION-DENIED',
      'P0-SUMMARY-CLEAN':'P0-SESSION-COMPLETE','P0-SUMMARY-ISSUES':'P0-NEXT-SET-READY',
      'P0-SESSION-GROUPS':'P0-SESSION-COMPLETE','P0-ABANDON-CONFIRM':'P0-SESSION-GROUPS',
      'P0-DRAFT-RESUME':'P0-DELETE-CONFIRM','P1-CAPABILITY-PRICE':'P0-SUMMARY-ISSUES',
      'P1-STORE-PURCHASING':'P1-STORE-CANCELLED','P1-STORE-SUCCESS':'P0-SUMMARY-ISSUES',
      'P1-CONSENT-DATA-LIST':'P0-SUMMARY-ISSUES','P1-KEYFRAME-DEFAULT':'P1-VIDEO-OPT-IN',
      'P1-VIDEO-OPT-IN':'P1-PREPARE','P1-UPLOADING':'P1-CLOUD-DELETING',
      'P1-ANALYZING':'P1-CLOUD-DELETING','P1-SERVICE-UNAVAILABLE':'P1-CLOUD-DELETING',
      'P1-RETRY':'P1-CLOUD-DELETING','P1-RESULT-LAYERED':'P1-CLOUD-RETENTION',
      'P1-RESULT-CONFLICT':'P1-RESULT-LAYERED','P1-RESULT-UNCERTAIN':'P1-CLOUD-RETENTION',
      'P1-CLOUD-RETENTION':'P1-RESULT-LAYERED','P1-CLOUD-DELETING':'P1-RESULT-LAYERED',
      'P1-CLOUD-DELETE-SUCCESS':'P0-HOME','P1-CLOUD-DELETE-FAILED':'P1-CLOUD-RETENTION'
    };
    function phone(s){const i=screenData.indexOf(s),prev=screenData[(i-1+screenData.length)%screenData.length],secondaryNext=secondaryTargets[s.id]||(s.recovery&&screenData.some(x=>x.id===s.recovery)?s.recovery:prev.id),isMapped=['04 本地数据与恢复','05 无障碍','06 Gemini 高级复盘','07 Gemini 异步任务','08 Gemini 结果与删除'].includes(s.group),visualDark=s.tone==='dark'||s.id==='P0-SAVE-PROGRESS',systemClass=s.group==='03 系统与设备'?' system-device-screen':'',mappedClass=isMapped?' mapped-screen':'',sectionClass=s.group==='04 本地数据与恢复'?' local-data-layout':s.group==='05 无障碍'?' a11y-layout':s.group.startsWith('06 ')||s.group.startsWith('07 ')||s.group.startsWith('08 ')?' gemini-layout':'';return '<div class="phone '+(visualDark?'dark':'')+'"><div class="island"></div><article class="screen '+(visualDark?'dark ':'')+(s.kind==='camera'||s.kind==='quality'?'camera-screen':'')+systemClass+mappedClass+sectionClass+(s.id==='P0-SAVE-PROGRESS'?' save-mode':'')+'" data-state-id="'+s.id+'" data-od-id="state-'+s.id.toLowerCase()+'"><header class="ios-head"><button class="icon-btn" data-go="'+prev.id+'" aria-label="返回上一状态">'+icon('back')+'</button><h2>'+s.name+'</h2><button class="icon-btn" data-go="'+s.next+'" aria-label="前往下一状态">'+icon('next')+'</button></header><div class="screen-body"><p class="condition">'+s.id+' · '+s.condition+'</p>'+coreContent(s)+'</div><div class="actions"><button class="app-btn" data-go="'+s.next+'">'+s.primary+'</button>'+(s.secondary?'<button class="app-btn secondary" data-go="'+secondaryNext+'">'+s.secondary+'</button>':'')+'</div>'+tabbar(s)+'</article></div>'}
    const groupDescriptions={'01 核心与会话':'P0 唯一主路径：一次会话包含多组训练并复用校准。','02 画面质量':'精确率优先；证据不足时暂停判断并给出单一修复动作。','03 系统与设备':'处理中断、资源占用和端侧模型故障，始终保留已成立事实。','04 本地数据与恢复':'草稿、保存、历史和删除均以会话为单位。','05 无障碍':'关键页面覆盖最大字号、VoiceOver、Reduce Motion 与语音等价文字。','06 Gemini 高级复盘':'P1 权益、购买和上传同意，与 P0 实时训练隔离。','07 Gemini 异步任务':'上传后可离开页面；所有网络与服务异常都有恢复路径。','08 Gemini 结果与删除':'训练记录、Gemini 的解读、看不准的内容和上传内容管理严格分层。'};
    const groups=document.getElementById('groups');
    function fitTitles(scope=document){scope.querySelectorAll('.screen-title').forEach(title=>{const length=[...title.textContent.trim()].length;title.classList.toggle('long',length>10);title.classList.toggle('xlong',length>16)})}
    function render(filter='全部'){const visible=filter==='全部'?screenData:screenData.filter(s=>filter==='P0'||filter==='P1'?s.tier===filter:s.group===filter);groups.innerHTML=[...new Set(visible.map(s=>s.group))].map(group=>'<section class="group" data-od-id="group-'+group.slice(0,2)+'"><div class="group-head"><div><p class="kicker">'+group+'</p><h2>'+group.slice(3)+'</h2></div><p>'+groupDescriptions[group]+'</p></div><div class="board-grid">'+visible.filter(s=>s.group===group).map(s=>'<article class="board" data-od-id="board-'+s.id.toLowerCase()+'"><div class="board-label"><div><h3>'+s.name+'</h3><p class="state-id">'+s.id+'</p></div><button class="open-board" data-open="'+s.id+'">聚焦</button><p class="board-entry">进入条件：'+s.condition+'</p></div>'+phone(s)+'</article>').join('')+'</div></section>').join('');fitTitles(groups)}
    const filterValues=['全部','P0','P1',...Object.keys(groupDescriptions)];document.getElementById('filters').innerHTML=filterValues.map((x,i)=>'<button class="filter '+(i===0?'active':'')+'" data-filter="'+x+'">'+x+'</button>').join('');
    document.getElementById('components').innerHTML=componentData.map((c,i)=>'<article class="component" data-od-id="component-'+String(i+1).padStart(2,'0')+'"><h3>'+c.name+'</h3>'+c.html+'</article>').join('');render();
    const stage=document.getElementById('stage'),stagePhone=document.getElementById('stagePhone'),stageTitle=document.getElementById('stageTitle'),stageId=document.getElementById('stageId'),stageCondition=document.getElementById('stageCondition');let current='P0-HOME';
    function openState(id){const s=screenData.find(x=>x.id===id);if(!s)return;current=id;stagePhone.innerHTML=phone(s);fitTitles(stagePhone);stageTitle.textContent=s.name;stageId.textContent=s.id;stageCondition.textContent='进入条件：'+s.condition;stage.classList.add('open');document.body.style.overflow='hidden';try{localStorage.setItem('ai-action-coach-v3-state',id)}catch{};requestAnimationFrame(()=>stageTitle.focus())}
    function closeStage(){stage.classList.remove('open');document.body.style.overflow=''}
    document.addEventListener('click',e=>{const filter=e.target.closest('[data-filter]');if(filter){document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===filter));render(filter.dataset.filter)}const open=e.target.closest('[data-open]');if(open)openState(open.dataset.open);const go=e.target.closest('[data-go]');if(go&&stage.classList.contains('open'))openState(go.dataset.go)});
    document.getElementById('stagePrev').onclick=()=>{const i=screenData.findIndex(x=>x.id===current);openState(screenData[(i-1+screenData.length)%screenData.length].id)};document.getElementById('stageNext').onclick=()=>{const i=screenData.findIndex(x=>x.id===current);openState(screenData[(i+1)%screenData.length].id)};document.getElementById('stageClose').onclick=closeStage;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage()});
  </script>
</body>
</html>
